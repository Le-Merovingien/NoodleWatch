[project]
name = "noodlewatch"
version = "0.1.0b0"                      # printwatch/__init__.py : 0.1.0-beta
description = "Spaghetti detection for the Prusa CORE One, pause through PrusaLink or a local Prusa Connect server"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
# torq-runtime (NPU and simulator) is published for Python 3.12 or later only
requires-python = ">=3.12"
dependencies = [
    "numpy>=2",
]

[project.optional-dependencies]
# PC: materiel = tflite, Buddy3D camera over RTSP, a video or an image folder
pc = [
    "opencv-python>=4.8",
    "ai-edge-litert>=1.2",
]
# board (materiel = npu) or NPU simulator on an x86 Linux PC (materiel = sim). On the board, keep the image's own
# OpenCV (built with GStreamer, needed by the camera): do not install the pc extra there.
npu = [
    "torq-runtime~=2.3.0",
]

[project.scripts]
printwatch = "printwatch.__main__:main"

[project.urls]
Homepage = "https://www.printables.com/model/1887405-noodlewatch-spaghetti-detection-for-prusa-core-one"
Source = "https://github.com/Le-Merovingien/NoodleWatch"

[build-system]
requires = ["uv_build>=0.8.14,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "printwatch"
module-root = ""
